name: JARVIS Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: jarvis-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout JARVIS
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify FFmpeg
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          ffmpeg -version | head -n 1

      - name: Run one worker cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          HUGGINGFACE_API_TOKEN: ${{ secrets.HUGGINGFACE_API_TOKEN }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          JARVIS_WORKER_ONCE: "1"
          JARVIS_WORKER_HEARTBEAT_MS: "15000"
          JARVIS_WORKER_CONCURRENCY: "4"
          JARVIS_WORKER_MAX_JOBS_PER_RUN: "24"
          JARVIS_WORKER_MAX_RUNTIME_MS: "540000"
          JARVIS_ROUTINE_BATCH_LIMIT: "10"
        run: |
          npm run worker
