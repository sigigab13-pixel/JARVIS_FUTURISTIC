name: JARVIS Worker

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: jarvis-main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
    steps:
      - name: Checkout JARVIS
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated tests
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Verify FFmpeg
        run: |
          command -v ffmpeg >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y ffmpeg; }
          ffmpeg -version | head -n 1

      - name: Run one worker cycle
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          JARVIS_WORKER_ONCE: "1"
          JARVIS_WORKER_HEARTBEAT_MS: "15000"
          JARVIS_WORKER_CONCURRENCY: "4"
          JARVIS_WORKER_MAX_JOBS_PER_RUN: "24"
          JARVIS_WORKER_MAX_RUNTIME_MS: "210000"
          JARVIS_ROUTINE_BATCH_LIMIT: "10"
          JARVIS_ATOMIC_IMAGE_CREDITS: "true"
        run: |
          npm run worker
