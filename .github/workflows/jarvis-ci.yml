name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: jarvis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify server secret wiring
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          test -n "${SUPABASE_SECRET_KEY:-}" || { echo "Missing SUPABASE_SECRET_KEY"; exit 1; }
          test -n "${HIGGSFIELD_API_KEY:-}" || { echo "Missing HIGGSFIELD_API_KEY"; exit 1; }
          test -n "${ELEVENLABS_API_KEY:-}" || { echo "Missing ELEVENLABS_API_KEY"; exit 1; }
          test -n "${ELEVENLABS_VOICE_ID:-}" || { echo "Missing ELEVENLABS_VOICE_ID"; exit 1; }
          echo "Required server secret names are present."

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
