name: JARVIS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: jarvis-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Verify server secret wiring
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          HIGGSFIELD_API_KEY: ${{ secrets.HIGGSFIELD_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          missing=0
          for name in SUPABASE_SECRET_KEY HIGGSFIELD_API_KEY ELEVENLABS_API_KEY ELEVENLABS_VOICE_ID; do
            case "$name" in
              SUPABASE_SECRET_KEY) value="${SUPABASE_SECRET_KEY:-}" ;;
              HIGGSFIELD_API_KEY) value="${HIGGSFIELD_API_KEY:-}" ;;
              ELEVENLABS_API_KEY) value="${ELEVENLABS_API_KEY:-}" ;;
              ELEVENLABS_VOICE_ID) value="${ELEVENLABS_VOICE_ID:-}" ;;
            esac
            if [ -n "$value" ]; then
              echo "$name: present"
            else
              echo "$name: MISSING"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Required server secrets are not all configured in GitHub Actions."
            exit 1
          fi
          echo "All required production server secrets are present."

      - name: Note PR secret policy
        if: github.event_name == 'pull_request'
        run: echo "PR validation does not require production provider secrets; protected deployment checks run on main."

      - name: Run tests
        run: npm test

      - name: Build frontend
        run: npm run build
